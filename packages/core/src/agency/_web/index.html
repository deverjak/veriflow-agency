<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<title>Agency</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9679;</text></svg>">
<style>
  /* One file, no framework, no build step — the same rule the extension
     follows. When this page needs a second file, it needed to be a PWA. */
  :root {
    --bg: #fbfbfa; --fg: #1a1a19; --dim: #6b6b66; --line: #e3e3df;
    --card: #ffffff; --accent: #1f6f4a; --warn: #9a6b00; --err: #a33;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --fg: #e8e8e4; --dim: #93938c; --line: #2a2a30;
      --card: #1d1d22; --accent: #57b287; --warn: #d9a441; --err: #e07b7b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 64px; }
  header {
    position: sticky; top: 0; background: var(--bg); z-index: 2;
    padding: 14px 0 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .meta { font-size: 12px; color: var(--dim); margin-left: auto;
                 flex: 0 0 auto; }
  /* The back control is a real one, because the phone's own is a route change
     now: both end up in the same place, which is the point. */
  header .back {
    background: none; border: 0; color: var(--fg); font: inherit; cursor: pointer;
    font-size: 22px; line-height: 1; padding: 0 6px 0 0; margin: 0;
  }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); font-weight: 600; margin: 26px 0 10px; }
  p { margin: 0 0 12px; }
  .dim { color: var(--dim); }
  .proj { margin: 22px 0 4px; }
  .proj .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .proj .head b { font-size: 16px; font-weight: 600; }
  .proj .head .where { font-size: 12px; color: var(--dim);
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj .head .more { margin-left: auto; font-size: 13px; }
  .chip {
    display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--accent); color: var(--accent); background: none;
    font-family: inherit; cursor: pointer; margin: 0 6px 8px 0;
  }
  .row {
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 8px; color: inherit; font: inherit; cursor: pointer;
  }
  .row:active { border-color: var(--accent); }
  .row .body { min-width: 0; flex: 1; }
  .row .title { font-weight: 600; display: block; }
  .row .sub { font-size: 13px; color: var(--dim); display: block;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .go { color: var(--dim); font-size: 18px; }
  button.primary {
    width: 100%; padding: 14px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
  }
  button.secondary {
    width: 100%; padding: 14px; border-radius: 12px; cursor: pointer;
    background: none; color: var(--fg); font: inherit; font-weight: 600;
    border: 1px solid var(--line); margin-top: 10px;
  }
  button.primary:disabled, button.secondary:disabled { opacity: .5; cursor: default; }
  button.link { background: none; border: 0; color: var(--dim); font: inherit;
                cursor: pointer; padding: 8px 0; text-decoration: underline; }
  input, textarea, select {
    width: 100%; padding: 12px; border-radius: 10px; font: inherit;
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
  }
  textarea { min-height: 96px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 14px 0 6px; }
  .note { font-size: 13px; color: var(--dim); margin: 10px 0 0; }
  .err { color: var(--err); font-size: 14px; margin: 12px 0; white-space: pre-wrap; }
  /* Why the run ended is an explanation, not a failure — it was painted in the
     error colour, which made a finished run look broken. */
  .why { color: var(--dim); font-size: 14px; margin: 12px 0; white-space: pre-wrap; }
  .doc { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         padding: 14px; margin: 8px 0; white-space: pre-wrap; word-break: break-word;
         font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .docs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .feed { font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
          margin-top: 12px; }
  .ev { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .ev .k { color: var(--dim); flex: 0 0 62px; }
  .ev .d { min-width: 0; word-break: break-word; }
  .ev.thinking .d, .ev.text .d { color: var(--dim); }
  .ev.denied .k, .ev.denied .d { color: var(--err); }
  .ev.done .k { color: var(--accent); }
  /* A question a person asked is not one of the agent's own events, and it
     would be unreadable if it looked like one. */
  .ev.asked { border-bottom-color: var(--accent); }
  .ev.asked .k, .ev.asked .d { color: var(--accent); }
  .counts { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .count { background: var(--card); border: 1px solid var(--line);
           border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .count b { font-size: 17px; display: block; font-weight: 600; }
  .panel { background: var(--card); border: 1px solid var(--accent);
           border-radius: 12px; padding: 14px; margin: 14px 0; }
  .panel b { display: block; margin-bottom: 4px; }
  .panel code { font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
                word-break: break-all; }
  .gap { height: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back hidden" id="back" aria-label="Back">&lsaquo;</button>
    <h1 id="title">Agency</h1>
    <span class="meta" id="meta"></span>
  </header>
  <main id="view"></main>
</div>

<script>
(function () {
  'use strict';

  // ------------------------------------------------------------- state
  const KEY_TOKEN = 'agency.token';
  const $ = (id) => document.getElementById(id);
  const state = {
    token: null, device: null, canOpenSession: false,
    packs: {},            // project key → what `agency packs` said, for a deep link
    stream: null, offset: 0, run: null,
    depth: 0,             // how many pushes of ours are on the history stack
    after: null,          // where the person was going when they had to pair
  };

  try { state.token = localStorage.getItem(KEY_TOKEN); } catch (e) { /* private mode */ }

  function remember(key, value) {
    try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); }
    catch (e) { /* the daemon is the source of truth either way */ }
  }

  // ------------------------------------------------------------- routing
  //
  // Every screen is a URL. On a phone that is not decoration: without it the
  // back gesture leaves the site — which it did, from the first run anyone
  // opened — and a run being watched cannot be shared, reloaded or reopened
  // from the home screen. The daemon serves this page for every path that is
  // not the API, so a reload lands where the person was.

  const ROUTES = [
    [/^\/$/,                                        () => viewHome()],
    [/^\/pair$/,                                    () => viewPair()],
    [/^\/p\/([^/]+)\/runs$/,                        (k) => viewRuns(k)],
    [/^\/p\/([^/]+)\/start\/([^/]+)$/,              (k, p) => viewStart(k, p)],
    [/^\/p\/([^/]+)\/run\/([^/]+)$/,                (k, r) => viewRun(k, r)],
    [/^\/p\/([^/]+)\/run\/([^/]+)\/doc\/(.+)$/,     (k, r, n) => viewDoc(k, r, n)],
  ];

  function parentOf(path) {
    let m = path.match(/^\/p\/([^/]+)\/run\/([^/]+)\/doc\/.+$/);
    if (m) return '/p/' + m[1] + '/run/' + m[2];
    m = path.match(/^\/p\/([^/]+)\/run\/[^/]+$/);
    if (m) return '/p/' + m[1] + '/runs';
    return '/';
  }

  function nav(path, opts) {
    opts = opts || {};
    if (path === location.pathname) return render();
    if (opts.replace) {
      history.replaceState({}, '', path);
    } else {
      history.pushState({}, '', path);
      state.depth += 1;
    }
    render();
  }

  function goBack() {
    // Our own push, so the phone's back and this button are the same motion.
    // Arriving straight on a deep link has nothing to go back to, and then the
    // parent route is the honest answer rather than leaving the app.
    if (state.depth > 0) history.back();
    else nav(parentOf(location.pathname), { replace: true });
  }

  window.addEventListener('popstate', () => {
    state.depth = Math.max(0, state.depth - 1);
    render();
  });

  $('back').onclick = goBack;

  function render() {
    closeStream();                    // a view that wants a stream opens its own
    const path = location.pathname;
    if (!state.token && path !== '/pair') {
      state.after = path === '/' ? null : path;
      return nav('/pair', { replace: true });
    }
    if (state.token && path === '/pair') return nav('/', { replace: true });
    for (const [pattern, view] of ROUTES) {
      const m = path.match(pattern);
      if (m) {
        chrome(path);
        try {
          const done = view.apply(null, m.slice(1).map(decodeURIComponent));
          if (done && done.catch) done.catch(fail);
          return done;
        } catch (e) { return fail(e); }
      }
    }
    chrome(path);
    $('view').innerHTML = '';
    $('view').appendChild(text('p', 'dim', 'No such screen.'));
    $('view').appendChild(link('Back to the projects', () => nav('/')));
  }

  function chrome(path) {
    $('back').classList.toggle('hidden', path === '/' || path === '/pair');
    $('view').innerHTML = '';
    window.scrollTo(0, 0);
  }

  function title(text) { $('title').textContent = text; }

  // ------------------------------------------------------------- elements
  function text(tag, cls, s) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (s !== undefined) el.textContent = s;
    return el;
  }

  function link(label, onClick) {
    const b = text('button', 'link', label);
    b.onclick = onClick;
    return b;
  }

  function button(label, cls, onClick) {
    const b = text('button', cls, label);
    b.onclick = onClick;
    return b;
  }

  function row(titleText, sub, onClick) {
    const el = document.createElement('button');
    el.className = 'row';
    el.innerHTML = '<span class="body"><span class="title"></span>'
      + '<span class="sub"></span></span><span class="go">&rsaquo;</span>';
    el.querySelector('.title').textContent = titleText;
    el.querySelector('.sub').textContent = sub || '';
    el.onclick = onClick;
    return el;
  }

  function fail(e) {
    const box = $('view').querySelector('.err') || $('view').appendChild(text('p', 'err'));
    box.textContent = e.message;
  }

  // ------------------------------------------------------------- api
  async function api(path, opts) {
    const o = Object.assign({ headers: {} }, opts || {});
    o.headers['Authorization'] = 'Bearer ' + state.token;
    if (o.body) o.headers['Content-Type'] = 'application/json';
    const r = await fetch(path, o);
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { signOut(); throw new Error('This device is not paired.'); }
    if (!r.ok) throw new Error(data.message || ('HTTP ' + r.status));
    return data;
  }

  function signOut() {
    state.token = null;
    remember(KEY_TOKEN, null);
    $('meta').textContent = '';
    nav('/pair', { replace: true });
  }

  function remaining(seconds) {
    const hours = Math.floor(seconds / 3600);
    const mins = Math.round((seconds % 3600) / 60);
    $('meta').textContent = (hours ? hours + ' h ' : '') + mins + ' min left';
  }

  // What this device may do and what the machine can offer it. Asked once,
  // and from the one endpoint that starts no subprocess — a screen reached by
  // a link, rather than by walking through the home screen, must not cost an
  // `agency packs` per project to learn whether it may show a button.
  async function machine() {
    if (state.device) return;
    const d = await api('/api/projects');
    state.device = d.device || null;
    state.canOpenSession = !!d.canOpenSession;
    remaining(d.activatedFor);
  }

  // ------------------------------------------------------------- 1 · pairing
  function viewPair() {
    title('Agency');
    const v = $('view');
    v.appendChild(text('h2', null, 'Pair this device'));
    v.appendChild(text('p', 'dim', 'The code is printed by `agency serve` on the '
      + 'machine. It is good for one device, for a few minutes.'));

    const codeLabel = text('label', null, 'Code');
    const code = document.createElement('input');
    code.id = 'code'; code.inputMode = 'numeric'; code.maxLength = 6;
    code.autocomplete = 'one-time-code'; code.placeholder = '000000';
    const nameLabel = text('label', null, 'Name this device');
    const name = document.createElement('input');
    name.placeholder = 'phone';

    const err = text('p', 'err');
    const go = button('Pair', 'primary', async () => {
      err.textContent = '';
      try {
        const r = await fetch('/api/pair', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code.value.trim(), name: name.value.trim() }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.message || 'Pairing failed.');
        state.token = data.token;
        remember(KEY_TOKEN, data.token);
        const after = state.after; state.after = null;
        nav(after || '/', { replace: true });
      } catch (e) { err.textContent = e.message; }
    });

    v.append(codeLabel, code, nameLabel, name,
      text('p', 'note', 'Starting a run with the authorization checks off is a right '
        + 'the machine grants at pairing, not something this page can ask for later.'),
      text('div', 'gap'), go, err);
    code.focus();
  }

  // ------------------------------------------------------------- 2 · everything
  async function viewHome() {
    title('Agency');
    const v = $('view');
    const box = text('div');
    v.appendChild(box);
    box.appendChild(text('p', 'dim', '…'));
    const err = text('p', 'err');
    v.append(err,
      link('Refresh', () => nav('/')),
      link('Forget this device', () => signOut()));

    let data;
    try { data = await api('/api/overview'); }
    catch (e) { box.innerHTML = ''; err.textContent = e.message; return; }

    state.device = data.device || null;
    state.canOpenSession = !!data.canOpenSession;
    remaining(data.activatedFor);

    box.innerHTML = '';
    if (!data.projects.length) {
      box.innerHTML = '<p class="dim">The machine is serving no project. '
        + '<code>agency serve --scan &lt;dir&gt;</code> opens every repository with a '
        + 'specialist in it.</p>';
      return;
    }
    for (const p of data.projects) box.appendChild(projectBlock(p));
  }

  function projectBlock(p) {
    state.packs[p.key] = p.packs || [];
    const el = text('div', 'proj');

    const head = text('div', 'head');
    head.appendChild(text('b', null, p.name));
    // A project whose name already is its slug printed the same string twice
    // and cost the header a second line on a phone. Say where it lives only
    // when that is not what the name already said.
    const where = p.slug === p.name ? '' : (p.slug || p.root);
    if (where) head.appendChild(text('span', 'where', where));
    const more = link('runs', () => nav('/p/' + encodeURIComponent(p.key) + '/runs'));
    more.className = 'link more';
    head.appendChild(more);
    el.appendChild(head);

    // What is happening right now comes first: a run in flight is the one
    // thing on this screen that changes without anybody touching the phone.
    for (const r of p.running || []) {
      el.appendChild(button('● ' + r.pack + ' running', 'chip',
        () => nav(runPath(p.key, r.runId))));
    }

    if (!(p.packs || []).length) {
      el.appendChild(text('p', 'dim',
        'No specialist here yet — a pack is written at the machine.'));
    }
    for (const pack of p.packs || []) {
      el.appendChild(row(pack.title || pack.name, pack.description || pack.skill,
        () => nav('/p/' + encodeURIComponent(p.key) + '/start/'
                  + encodeURIComponent(pack.name))));
    }
    return el;
  }

  const runPath = (key, id) =>
    '/p/' + encodeURIComponent(key) + '/run/' + encodeURIComponent(id);

  // ------------------------------------------------------------- 3 · the runs
  async function viewRuns(key) {
    title(key + ' · runs');
    const v = $('view');
    const box = text('div');
    box.appendChild(text('p', 'dim', '…'));
    v.append(box, text('p', 'err'));
    try {
      const data = await api('/api/runs?project=' + encodeURIComponent(key) + '&limit=20');
      box.innerHTML = '';
      if (!data.runs.length) box.appendChild(text('p', 'dim', 'Nothing has run here yet.'));
      for (const r of data.runs) {
        const when = (r.startedAt || '').replace('T', ' ').slice(0, 16);
        box.appendChild(row(r.pack + ' · ' + r.status,
          when + ' · ' + (r.targetLabel || '') + ' · ' + r.findings + ' findings',
          () => nav(runPath(key, r.id))));
      }
    } catch (e) { box.innerHTML = ''; fail(e); }
  }

  // ------------------------------------------------------------- 4 · starting
  async function viewStart(key, packName) {
    title(packName);
    const v = $('view');
    v.appendChild(text('p', 'dim', '…'));
    await machine().catch(() => {});

    let pack = (state.packs[key] || []).find((p) => p.name === packName);
    if (!pack) {
      // A deep link, or a reload: the overview was never fetched in this
      // session, so ask the one project rather than making the person walk
      // back through the home screen.
      try {
        const packs = await api('/api/packs?project=' + encodeURIComponent(key));
        state.packs[key] = packs;
        pack = packs.find((p) => p.name === packName);
      } catch (e) { $('view').innerHTML = ''; return fail(e); }
    }
    if (!pack) {
      $('view').innerHTML = '';
      $('view').appendChild(text('p', 'dim', '“' + packName + '” is not a specialist in '
        + key + '.'));
      return;
    }

    $('view').innerHTML = '';
    title(pack.title || pack.name);
    v.appendChild(text('p', 'dim', key + ' — ' + (pack.description || '')));

    let prSelect = null;
    if (pack.run.target === 'pull-request') {
      v.appendChild(text('label', null, 'Pull request'));
      prSelect = document.createElement('select');
      prSelect.innerHTML = '<option value="">…</option>';
      v.appendChild(prSelect);
      fillPullRequests(key, prSelect);
    }

    let prompt = null;
    if (pack.run.prompt !== 'none') {
      v.appendChild(text('label', null, pack.run.prompt === 'required'
        ? 'What should this run work on? (required)'
        : 'What should this run focus on? (optional)'));
      prompt = document.createElement('textarea');
      prompt.placeholder = '…';
      v.appendChild(prompt);
    }

    const err = text('p', 'err');
    const unsupervised = button('Run unsupervised', 'primary',
      () => start('unattended'));
    const takeover = button('Open a session I can talk to', 'secondary',
      () => start('interactive'));

    v.append(text('p', 'note', 'Unsupervised: nobody is at the terminal, so the run '
      + 'never stops to ask, and the gate runs by itself when it ends.'),
      text('div', 'gap'), unsupervised);
    if (state.canOpenSession) {
      v.appendChild(takeover);
      v.appendChild(text('p', 'note', 'The second one opens Claude Code in a window on '
        + 'the machine with Remote Control on — you carry on with it in the Claude app, '
        + 'and run the gate from here when you are done.'));
    }
    v.appendChild(err);

    async function start(mode) {
      const body = { project: key, pack: pack.name, mode: mode };
      const q = prompt ? prompt.value.trim() : '';
      if (pack.run.prompt === 'required' && !q) {
        err.textContent = 'This specialist needs to know what to work on.';
        return;
      }
      if (q) body.prompt = q;
      if (prSelect) {
        if (!prSelect.value) { err.textContent = 'Pick a pull request.'; return; }
        body.pr = Number(prSelect.value);
      }
      err.textContent = '';
      unsupervised.disabled = takeover.disabled = true;
      // Preparation resolves the pull request and can build a worktree, so the
      // answer takes seconds. Saying so beats a button that looks broken.
      unsupervised.textContent = 'Preparing the run…';
      try {
        const data = await api('/api/run', { method: 'POST', body: JSON.stringify(body) });
        nav(runPath(key, data.runId));
      } catch (e) {
        err.textContent = e.message;
        unsupervised.disabled = takeover.disabled = false;
        unsupervised.textContent = 'Run unsupervised';
      }
    }
  }

  async function fillPullRequests(key, sel) {
    try {
      const prs = await api('/api/prs?project=' + encodeURIComponent(key)
        + '&state=open&limit=20');
      sel.innerHTML = '';
      if (!prs.length) sel.innerHTML = '<option value="">no open pull request</option>';
      for (const p of prs) {
        const o = document.createElement('option');
        o.value = String(p.number);
        o.textContent = '#' + p.number + ' — ' + (p.title || '')
          + (p.reviewed ? '  · already reviewed' : '');
        sel.appendChild(o);
      }
    } catch (e) { fail(e); }
  }

  // ------------------------------------------------------------- 5 · one run
  async function viewRun(key, runId) {
    title(runId.slice(0, 10));
    state.run = { key: key, id: runId };
    state.offset = 0;
    await machine().catch(() => {});
    const v = $('view');

    const counts = text('div', 'counts');
    const session = text('div');
    const asked = text('div');
    const feed = text('div', 'feed');
    const why = text('p', 'why');
    const after = text('div');
    const docs = text('div', 'docs');
    const err = text('p', 'err');
    v.append(counts, session, asked, feed, why, after, docs, err);

    const q = '?project=' + encodeURIComponent(key)
      + '&token=' + encodeURIComponent(state.token);

    api('/api/run/' + encodeURIComponent(runId) + q).then(paint).catch(fail);
    stream(runId, q, 0);

    function paint(s) {
      title((s.pack || 'run') + ' · ' + key);
      err.textContent = '';
      state.run.state = s;

      counts.innerHTML = '';
      const tiles = [['status', s.status]];
      const c = s.counts || {};
      if (c.raw !== undefined) tiles.push(['written', c.raw]);
      if (c.kept !== undefined) tiles.push(['kept', c.kept]);
      if (c.gated !== undefined) tiles.push(['gated out', c.gated]);
      if (c.duplicates !== undefined) tiles.push(['duplicates', c.duplicates]);
      if (s.denied) tiles.push(['refused calls', s.denied]);
      for (const [label, value] of tiles) {
        const el = text('div', 'count');
        el.appendChild(text('b', null, String(value)));
        el.appendChild(text('span', null, label));
        counts.appendChild(el);
      }

      // A session with Remote Control on has no live progress and never will:
      // an interactive `claude` publishes no machine-readable stream. Saying
      // where the conversation is beats pretending to show one.
      session.innerHTML = '';
      if (s.remoteControl) {
        const p = text('div', 'panel');
        p.appendChild(text('b', null, s.status === 'running'
          ? 'This session is live in the Claude app'
          : 'This session was driven from the Claude app'));
        p.appendChild(text('code', null, s.remoteControl));
        p.appendChild(text('p', 'note', 'Claude Code is open in a window on the machine. '
          + 'Everything it does is there and in that session — not here.'));
        session.appendChild(p);
      }

      asked.innerHTML = '';
      for (const f of s.followUps || []) {
        asked.appendChild(evLine('asked', 'asked', f.prompt || ''));
      }

      why.textContent = s.exitReason || '';

      docs.innerHTML = '';
      for (const name of s.outputs || []) {
        docs.appendChild(link(name, () => nav(runPath(key, runId)
          + '/doc/' + encodeURIComponent(name))));
      }

      paintAfter(s);
    }

    // What can still be done to this run. All of it is one question — is the
    // session reachable — and the record is the only thing that knows.
    function paintAfter(s) {
      after.innerHTML = '';
      if (s.status === 'running' && !s.remoteControl) return;   // it is still talking

      if (s.canFollow) {
        const box = document.createElement('textarea');
        box.placeholder = 'and what about the migration?';
        const ask = button('Ask', 'primary', () => send('unattended'));
        const takeover = button('Carry on in the Claude app', 'secondary',
          () => send('interactive'));

        async function send(mode) {
          const question = box.value.trim();
          if (!question) { err.textContent = 'A follow-up is a question.'; return; }
          err.textContent = '';
          ask.disabled = takeover.disabled = true;
          ask.textContent = 'Asking…';
          const body = { project: key, prompt: question, mode: mode };
          // The run was allowed to work without the checks; the question that
          // continues it needs the same, or it is refused halfway through its
          // own answer. A device without that right asks without it.
          if (s.authorized === 'bypass' && state.device && state.device.bypass) {
            body.bypass = true;
          }
          try {
            await api('/api/run/' + encodeURIComponent(runId) + '/follow',
              { method: 'POST', body: JSON.stringify(body) });
            asked.appendChild(evLine('asked', 'asked', question));
            box.value = '';
            after.innerHTML = '';
            // The answer arrives in this run's own stream, so pick it up where
            // this page stopped reading rather than replaying the whole run.
            stream(runId, q, state.offset);
          } catch (e) {
            err.textContent = e.message;
            ask.disabled = takeover.disabled = false;
            ask.textContent = 'Ask';
          }
        }

        after.append(text('label', null, 'Ask this specialist one more thing'), box, ask);
        if (state.canOpenSession && s.canTakeOver) after.appendChild(takeover);
        after.appendChild(text('p', 'note', 'The same session, so it still knows what it '
          + 'found and why. The gate keeps its verdict — run it again below if the '
          + 'answer changed the findings.'));
      }

      // The gate after a session nobody watched to the end. `--wait` runs it
      // by itself when the agent exits; a Remote Control session does not exit,
      // so this is the button that finishes it — the same one the editor has.
      const gateWorth = s.remoteControl || (s.followUps || []).length;
      if (gateWorth) {
        after.appendChild(link(
          s.counts ? 'Run the gate again' : 'Run the gate', async () => {
            err.textContent = '';
            try {
              await api('/api/run/' + encodeURIComponent(runId) + '/ingest',
                { method: 'POST', body: JSON.stringify({ project: key }) });
              const fresh = await api('/api/run/' + encodeURIComponent(runId) + q);
              paint(fresh);
            } catch (e) { err.textContent = e.message; }
          }));
      }
    }

    function stream(id, query, from) {
      closeStream();
      // The stream is opened either way: a finished run replays what the agent
      // did and closes itself, which is the same screen with no waiting.
      const es = new EventSource('/api/run/' + encodeURIComponent(id) + '/events'
        + query + '&offset=' + from);
      state.stream = es;
      es.onmessage = (e) => {
        err.textContent = '';        // whatever the last drop said, it is back
        state.offset = Number(e.lastEventId) || state.offset;
        append(JSON.parse(e.data));
      };
      es.addEventListener('done', (e) => {
        closeStream();               // or the browser reconnects and replays it
        paint(JSON.parse(e.data));
      });
      es.onerror = () => {
        // EventSource reconnects on its own and the daemon resumes from
        // Last-Event-ID, so this is a note, not a failure.
        err.textContent = 'Connection lost — reconnecting.';
      };
    }

    function append(ev) {
      const kind = ev.kind === 'tool' ? (ev.tool || 'tool') : ev.kind;
      const stuck = window.innerHeight + window.scrollY >= document.body.scrollHeight - 60;
      feed.appendChild(evLine(ev.kind, kind, ev.detail || ''));
      if (stuck) window.scrollTo(0, document.body.scrollHeight);
    }
  }

  function evLine(cls, kind, detail) {
    const el = text('div', 'ev ' + cls);
    el.appendChild(text('span', 'k', kind));
    el.appendChild(text('span', 'd', detail));
    return el;
  }

  function closeStream() {
    if (state.stream) { state.stream.close(); state.stream = null; }
  }

  // ------------------------------------------------------------- 6 · a document
  //
  // The run's own documents, each with a URL. A summary that says "answered in
  // answer.md" is only an answer if answer.md can be opened — and closed with
  // the back gesture, which is what makes it a screen rather than a panel.
  async function viewDoc(key, runId, name) {
    title(name);
    const v = $('view');
    v.appendChild(text('p', 'dim', '…'));
    const q = '?project=' + encodeURIComponent(key)
      + '&token=' + encodeURIComponent(state.token)
      + '&name=' + encodeURIComponent(name);
    try {
      const d = await api('/api/run/' + encodeURIComponent(runId) + '/output' + q);
      v.innerHTML = '';
      v.appendChild(text('div', 'doc', d.text + (d.clipped ? '\n\n[…truncated]' : '')));
      v.appendChild(link('Back to the run', () => goBack()));
    } catch (e) { v.innerHTML = ''; fail(e); }
  }

  // ------------------------------------------------------------- start
  render();
})();
</script>
</body>
</html>
