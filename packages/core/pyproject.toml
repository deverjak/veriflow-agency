[project]
name = "agency"
version = "0.1.0"
description = "VeriFlow Agency — specialists for your repository. Attended, on your own login, with evidence-backed findings that stay."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
]

[project.scripts]
agency = "agency.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency"]

# Schemas live at the repo root, not inside the package — the extension
# reads them too. Bundled into the wheel so `uv tool install` works from
# anywhere.
#
# Of the packs, exactly ONE ships: `author`. A pack is normally a skill in
# the target project, written for it and never installed from here — which
# holds for every pack in `packs/` except this one, whose subject is this
# system rather than any project. Without it a fresh repository has no way to
# write its first specialist, so `agency init` copies it in and the rest get
# written by it, in place.
[tool.hatch.build.targets.wheel.force-include]
"../../schemas" = "agency/_bundled/schemas"
"../../packs/author" = "agency/_bundled/packs/author"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Core tests run outside VS Code and outside any real user repository — the
# whole chain is built over a throwaway git repo, so they can run hundreds
# of times in a row.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
