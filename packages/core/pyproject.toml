[project]
name = "agency"
version = "0.1.0"
description = "VeriFlow Agency — specialists for your repository. Attended, on your own login, with evidence-backed findings that stay."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
]

[project.scripts]
agency = "agency.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency"]

# Schemas live at the repo root, not inside the package — the extension
# reads them too. Bundled into the wheel so `uv tool install` works from
# anywhere. Packs are not bundled: a pack is a skill in the target project,
# never installed from here.
[tool.hatch.build.targets.wheel.force-include]
"../../schemas" = "agency/_bundled/schemas"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Core tests run outside VS Code and outside any real user repository — the
# whole chain is built over a throwaway git repo, so they can run hundreds
# of times in a row.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
