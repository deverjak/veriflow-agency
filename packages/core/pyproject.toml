[project]
name = "agency"
version = "0.1.0"
description = "VeriFlow Agency — specialisté, které si najmeš do repozitáře. Attended, na tvém přihlášení, s doloženými nálezy, které zůstanou."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
]

[project.scripts]
agency = "agency.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency"]

# Packs a schemas leží v kořeni repa, ne uvnitř balíčku — sdílí je i TypeScript
# klient. Do wheelu se přibalí, aby `uv tool install` fungoval odkudkoli.
[tool.hatch.build.targets.wheel.force-include]
"../../packs" = "agency/_bundled/packs"
"../../schemas" = "agency/_bundled/schemas"
