<svg id="dg-2q" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="q2-title q2-desc">
<title id="q2-title">Two questions about one bet, counted apart</title>
<desc id="q2-desc">A type may declare more than one lifecycle: whether the bet was chosen is one question with its own rate, and whether it worked is a second question asked only of the bets that were chosen, so the two numbers never collapse into one.</desc>
<style>
  #dg-2q{--paper:#fbfaf7;--paper2:#ffffff;--ink:#1b1a17;--muted:#6d6a62;--soft:#8f8c83;
    --rule:rgba(27,26,23,0.12);--rule-solid:#e6e3dc;--accent:#1f6f4a;--accent-tint:rgba(31,111,74,0.08);
    --wash:rgba(27,26,23,0.02);--wash2:rgba(27,26,23,0.05);
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --serif:'Instrument Serif',Georgia,'Times New Roman',serif}
  @media (prefers-color-scheme:dark){#dg-2q{--paper:#14140f;--paper2:#1b1b15;--ink:#eceae3;--muted:#97948a;
    --soft:#7d7a71;--rule:rgba(236,234,227,0.12);--rule-solid:#2b2a24;--accent:#6cba8e;
    --accent-tint:rgba(108,186,142,0.12);--wash:rgba(236,234,227,0.03);--wash2:rgba(236,234,227,0.06)}}
  #dg-2q text{font-family:var(--sans);fill:var(--ink)}
  #dg-2q .eb{font-family:var(--mono);font-size:7px;letter-spacing:.08em;fill:var(--muted)}
  #dg-2q .zn{font-family:var(--mono);font-size:7px;letter-spacing:.14em;fill:var(--soft)}
  #dg-2q .nm{font-size:12px;font-weight:600}
  #dg-2q .key{font-family:var(--mono);font-size:12px;font-weight:600}
  #dg-2q .sub{font-family:var(--mono);font-size:9px;fill:var(--muted)}
  #dg-2q .al{font-family:var(--mono);font-size:8px;letter-spacing:.06em;fill:var(--soft)}
  #dg-2q .pol{font-family:var(--mono);font-size:9px;fill:var(--muted)}
  #dg-2q .rd{font-family:var(--mono);font-size:10px;fill:var(--ink)}
  #dg-2q .rdm{font-family:var(--mono);font-size:10px;fill:var(--muted)}
  #dg-2q .aside{font-family:var(--serif);font-style:italic;font-size:14px;fill:var(--muted)}
  #dg-2q .mask{fill:var(--paper)}
  #dg-2q .box{fill:var(--paper2);stroke:var(--ink);stroke-width:1}
  #dg-2q .store{fill:var(--wash2);stroke:var(--muted);stroke-width:1}
  #dg-2q .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1}
  #dg-2q .zone{fill:var(--wash);stroke:var(--rule);stroke-width:.8}
  #dg-2q .tag{fill:none;stroke:var(--muted);stroke-width:.8;opacity:.55}
  #dg-2q .ln{fill:none;stroke:var(--muted);stroke-width:1.2}
  #dg-2q .ln-a{fill:none;stroke:var(--accent);stroke-width:1.2}
  #dg-2q .hd{stroke:var(--rule);stroke-width:.8}
  #dg-2q .lead{stroke:var(--rule-solid);stroke-width:.8;stroke-dasharray:3 3}
  #dg-2q .hair{stroke:var(--rule);stroke-width:.8}
  #dg-2q .dot{fill:var(--muted)}
  #dg-2q .mk{fill:var(--muted)}
  #dg-2q .mk-a{fill:var(--accent)}
</style>
<defs>
  <marker id="q2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon class="mk" points="0 0, 8 3, 0 6"/>
  </marker>
  <marker id="q2-arrow-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon class="mk-a" points="0 0, 8 3, 0 6"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="var(--paper)"/>

<!-- zones -->
<rect class="zone" x="328" y="96" width="248" height="280" rx="8"/>
<rect class="mask" x="344" y="100" width="180" height="12"/>
<text class="zn" x="352" y="109">SELECTION · SELECTION_RATE</text>

<rect class="zone" x="672" y="64" width="288" height="224" rx="8"/>
<rect class="mask" x="688" y="68" width="164" height="12"/>
<text class="zn" x="696" y="77">OUTCOME · SUCCESS_RATE</text>

<!-- connectors -->
<line class="ln" x1="240" y1="244" x2="292" y2="244"/>
<circle class="dot" cx="296" cy="244" r="4"/>
<path class="ln" d="M 296,244 V 176 Q 296,168 304,168 H 350" marker-end="url(#q2-arrow)"/>
<path class="ln" d="M 296,244 V 312 Q 296,320 304,320 H 350" marker-end="url(#q2-arrow)"/>
<line class="ln-a" x1="552" y1="168" x2="694" y2="168" marker-end="url(#q2-arrow-a)"/>

<rect class="mask" x="246" y="224" width="44" height="12"/><text class="al" x="248" y="233">ANSWER</text>
<rect class="mask" x="599" y="148" width="48" height="12"/><text class="al" x="623" y="157" text-anchor="middle" fill="var(--accent)">REQUIRES</text>

<!-- the output -->
<rect class="mask" x="40" y="200" width="200" height="88" rx="6"/>
<rect class="store" x="40" y="200" width="200" height="88" rx="6"/>
<rect class="tag" x="52" y="210" width="44" height="12" rx="2"/>
<text class="eb" x="74" y="219" text-anchor="middle">OUTPUT</text>
<text class="nm" x="140" y="252" text-anchor="middle">A bet</text>
<text class="sub" x="140" y="270" text-anchor="middle">type = bet</text>

<!-- selected (focal) -->
<rect class="mask" x="352" y="136" width="200" height="64" rx="6"/>
<rect class="focal" x="352" y="136" width="200" height="64" rx="6"/>
<text class="key" x="368" y="164" fill="var(--accent)">selected</text>
<text class="sub" x="368" y="182">the founder took it</text>
<rect class="tag" x="520" y="146" width="16" height="12" rx="2" stroke="var(--accent)"/>
<text class="pol" x="528" y="155" text-anchor="middle" fill="var(--accent)">+</text>

<!-- rejected -->
<rect class="mask" x="352" y="288" width="200" height="64" rx="6"/>
<rect class="box" x="352" y="288" width="200" height="64" rx="6"/>
<text class="key" x="368" y="316">rejected</text>
<text class="sub" x="368" y="334">it was not taken</text>
<rect class="tag" x="520" y="298" width="16" height="12" rx="2"/>
<text class="pol" x="528" y="307" text-anchor="middle">−</text>

<line class="lead" x1="552" y1="320" x2="584" y2="320"/>
<text class="sub" x="592" y="316">a rejected bet is never asked</text>
<text class="sub" x="592" y="332">how it turned out — it has no outcome</text>

<!-- outcome -->
<rect class="mask" x="696" y="112" width="264" height="144" rx="6"/>
<rect class="box" x="696" y="112" width="264" height="144" rx="6"/>
<text class="nm" x="712" y="138">Did it work?</text>
<text class="sub" x="712" y="156">requires: selection.selected</text>
<line class="hd" x1="696" y1="168" x2="960" y2="168"/>
<text class="key" x="712" y="192">successful</text>
<rect class="tag" x="928" y="182" width="16" height="12" rx="2"/>
<text class="pol" x="936" y="191" text-anchor="middle">+</text>
<text class="key" x="712" y="216">failed</text>
<rect class="tag" x="928" y="206" width="16" height="12" rx="2"/>
<text class="pol" x="936" y="215" text-anchor="middle">−</text>
<text class="key" x="712" y="240">abandoned</text>
<rect class="tag" x="928" y="230" width="16" height="12" rx="2"/>
<text class="pol" x="936" y="239" text-anchor="middle">·</text>

<!-- readout -->
<line class="hair" x1="40" y1="412" x2="960" y2="412"/>
<text class="zn" x="40" y="432">HOW EACH RATE IS COUNTED</text>
<text class="rd" x="40" y="456">selection_rate = selected / (selected + rejected)</text>
<text class="rd" x="40" y="474">success_rate   = successful / (successful + failed)</text>
<text class="rdm" x="40" y="492">a neutral answer is recorded and left out of the ratio; a question nobody answered is undecided, not a failure</text>

<text class="aside" x="40" y="534">(selected + successful) / everything is neither of these. It is a number that looks like a metric.</text>
</svg>
