<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From a run to a board and back · VeriFlow Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#fbfaf7;--ink:#1b1a17;--muted:#6d6a62;
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --serif:'Instrument Serif',Georgia,serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){:root{--paper:#14140f;--ink:#eceae3;--muted:#97948a}}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1200px;width:100%}
  .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
    letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
  svg{width:100%;min-width:900px;display:block}
  .colophon{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-top:1.5rem;padding-top:.75rem;border-top:1px solid rgba(109,106,98,.25)}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Process · VeriFlow Agency</p>
<h1>From a run to a board and back</h1>
<svg id="dg-run" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" role="img" aria-labelledby="run-title run-desc">
<title id="run-title">From a run to a board and back</title>
<desc id="run-desc">Eight stages carry a specialist's work from preparing the run to the metrics: prepare, the agent, the gate, dedup, dispatch, the board and committed memory, a person's verdict, and the metrics that verdict feeds; what the gate refuses is written aside with its reason instead.</desc>
<style>
  #dg-run{--paper:#fbfaf7;--paper2:#ffffff;--ink:#1b1a17;--muted:#6d6a62;--soft:#8f8c83;
    --rule:rgba(27,26,23,0.12);--rule-solid:#e6e3dc;--accent:#1f6f4a;--accent-tint:rgba(31,111,74,0.08);
    --wash:rgba(27,26,23,0.02);--wash2:rgba(27,26,23,0.05);
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){#dg-run{--paper:#14140f;--paper2:#1b1b15;--ink:#eceae3;--muted:#97948a;
    --soft:#7d7a71;--rule:rgba(236,234,227,0.12);--rule-solid:#2b2a24;--accent:#6cba8e;
    --accent-tint:rgba(108,186,142,0.12);--wash:rgba(236,234,227,0.03);--wash2:rgba(236,234,227,0.06)}}
  #dg-run text{font-family:var(--sans);fill:var(--ink)}
  #dg-run .eb{font-family:var(--mono);font-size:7px;letter-spacing:.08em;fill:var(--muted)}
  #dg-run .zn{font-family:var(--mono);font-size:7px;letter-spacing:.14em;fill:var(--soft)}
  #dg-run .nm{font-size:12px;font-weight:600}
  #dg-run .sub{font-family:var(--mono);font-size:9px;fill:var(--muted)}
  #dg-run .al{font-family:var(--mono);font-size:8px;letter-spacing:.06em;fill:var(--soft)}
  #dg-run .lg{font-family:var(--mono);font-size:8px;letter-spacing:.06em;fill:var(--muted)}
  #dg-run .mask{fill:var(--paper)}
  #dg-run .box{fill:var(--paper2);stroke:var(--ink);stroke-width:1}
  #dg-run .store{fill:var(--wash2);stroke:var(--muted);stroke-width:1}
  #dg-run .opt{fill:var(--wash);stroke:var(--rule-solid);stroke-width:1;stroke-dasharray:4 3}
  #dg-run .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1}
  #dg-run .tag{fill:none;stroke-width:.8}
  #dg-run .ln{fill:none;stroke:var(--muted);stroke-width:1.2}
  #dg-run .ln-a{fill:none;stroke:var(--accent);stroke-width:1.2}
  #dg-run .ln-d{fill:none;stroke:var(--rule-solid);stroke-width:1;stroke-dasharray:4 3}
  #dg-run .hair{stroke:var(--rule);stroke-width:.8}
  #dg-run .mk{fill:var(--muted)}
  #dg-run .mk-a{fill:var(--accent)}
  #dg-run .mk-d{fill:var(--rule-solid)}
</style>
<defs>
  <marker id="run-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon class="mk" points="0 0, 8 3, 0 6"/>
  </marker>
  <marker id="run-arrow-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon class="mk-a" points="0 0, 8 3, 0 6"/>
  </marker>
  <marker id="run-arrow-d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon class="mk-d" points="0 0, 8 3, 0 6"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="var(--paper)"/>

<text class="zn" x="40" y="72">THE RUN, AND THE GATE AT THE END OF IT</text>
<text class="zn" x="40" y="352">WHAT CAME OF IT — READ RIGHT TO LEFT</text>

<!-- connectors first -->
<line class="ln" x1="204" y1="180" x2="290" y2="180" marker-end="url(#run-arrow)"/>
<line class="ln" x1="456" y1="180" x2="542" y2="180" marker-end="url(#run-arrow)"/>
<line class="ln-a" x1="708" y1="180" x2="794" y2="180" marker-end="url(#run-arrow-a)"/>
<path class="ln" d="M 878,224 V 372" marker-end="url(#run-arrow)"/>
<line class="ln" x1="796" y1="420" x2="710" y2="420" marker-end="url(#run-arrow)"/>
<line class="ln" x1="544" y1="420" x2="458" y2="420" marker-end="url(#run-arrow)"/>
<line class="ln" x1="292" y1="420" x2="206" y2="420" marker-end="url(#run-arrow)"/>
<path class="ln-d" d="M 626,224 V 276" marker-end="url(#run-arrow-d)"/>

<!-- arrow labels: mask sits 6px clear of the stroke -->
<rect class="mask" x="216" y="160" width="64" height="12"/><text class="al" x="248" y="169" text-anchor="middle">PROMPT.TXT</text>
<rect class="mask" x="462" y="160" width="76" height="12"/><text class="al" x="500" y="169" text-anchor="middle">FINDINGS.JSON</text>
<rect class="mask" x="714" y="160" width="76" height="12"/><text class="al" x="752" y="169" text-anchor="middle">WHAT SURVIVED</text>
<rect class="mask" x="886" y="292" width="68" height="12"/><text class="al" x="886" y="301">IF NOT HELD</text>
<rect class="mask" x="722" y="400" width="62" height="12"/><text class="al" x="753" y="409" text-anchor="middle">ONE ACTION</text>
<rect class="mask" x="474" y="400" width="52" height="12"/><text class="al" x="500" y="409" text-anchor="middle">A PERSON</text>
<rect class="mask" x="228" y="400" width="42" height="12"/><text class="al" x="249" y="409" text-anchor="middle">EVENTS</text>
<rect class="mask" x="634" y="240" width="46" height="12"/><text class="al" x="636" y="249">REFUSED</text>

<!-- 1 prepare -->
<rect class="mask" x="40" y="136" width="164" height="88" rx="6"/>
<rect class="box" x="40" y="136" width="164" height="88" rx="6"/>
<rect class="tag" x="52" y="146" width="48" height="12" rx="2" stroke="var(--ink)" opacity=".45"/>
<text class="eb" x="76" y="155" text-anchor="middle">PREPARE</text>
<text class="nm" x="122" y="188" text-anchor="middle">agency run</text>
<text class="sub" x="122" y="206" text-anchor="middle">context.json</text>

<!-- 2 the agent -->
<rect class="mask" x="292" y="136" width="164" height="88" rx="6"/>
<rect class="box" x="292" y="136" width="164" height="88" rx="6"/>
<rect class="tag" x="304" y="146" width="32" height="12" rx="2" stroke="var(--ink)" opacity=".45"/>
<text class="eb" x="320" y="155" text-anchor="middle">WORK</text>
<text class="nm" x="374" y="188" text-anchor="middle">The agent</text>
<text class="sub" x="374" y="206" text-anchor="middle">claude · codex</text>

<!-- 3 the gate (focal) -->
<rect class="mask" x="544" y="136" width="164" height="88" rx="6"/>
<rect class="focal" x="544" y="136" width="164" height="88" rx="6"/>
<rect class="tag" x="556" y="146" width="52" height="12" rx="2" stroke="var(--accent)" opacity=".6"/>
<text class="eb" x="582" y="155" text-anchor="middle" fill="var(--accent)">THE GATE</text>
<text class="nm" x="626" y="188" text-anchor="middle">agency ingest</text>
<text class="sub" x="626" y="206" text-anchor="middle">nine refusals</text>

<!-- 4 dedup -->
<rect class="mask" x="796" y="136" width="164" height="88" rx="6"/>
<rect class="box" x="796" y="136" width="164" height="88" rx="6"/>
<rect class="tag" x="808" y="146" width="36" height="12" rx="2" stroke="var(--ink)" opacity=".45"/>
<text class="eb" x="826" y="155" text-anchor="middle">PLACE</text>
<text class="nm" x="878" y="188" text-anchor="middle">Dedup</text>
<text class="sub" x="878" y="206" text-anchor="middle">subject key</text>

<!-- refused -->
<rect class="mask" x="544" y="276" width="164" height="44" rx="6"/>
<rect class="opt" x="544" y="276" width="164" height="44" rx="6"/>
<text class="nm" x="626" y="297" text-anchor="middle">gated.json</text>
<text class="sub" x="626" y="312" text-anchor="middle">with the reason</text>

<!-- 5 dispatch -->
<rect class="mask" x="796" y="376" width="164" height="88" rx="6"/>
<rect class="box" x="796" y="376" width="164" height="88" rx="6"/>
<rect class="tag" x="808" y="386" width="28" height="12" rx="2" stroke="var(--ink)" opacity=".45"/>
<text class="eb" x="822" y="395" text-anchor="middle">ACT</text>
<text class="nm" x="878" y="428" text-anchor="middle">Dispatch</text>
<text class="sub" x="878" y="446" text-anchor="middle">the pack's sink</text>

<!-- 6 lands -->
<rect class="mask" x="544" y="376" width="164" height="88" rx="6"/>
<rect class="store" x="544" y="376" width="164" height="88" rx="6"/>
<rect class="tag" x="556" y="386" width="36" height="12" rx="2" stroke="var(--muted)" opacity=".55"/>
<text class="eb" x="574" y="395" text-anchor="middle">LANDS</text>
<text class="nm" x="626" y="428" text-anchor="middle">Board · memory</text>
<text class="sub" x="626" y="446" text-anchor="middle">actions[]</text>

<!-- 7 verdict -->
<rect class="mask" x="292" y="376" width="164" height="88" rx="6"/>
<rect class="box" x="292" y="376" width="164" height="88" rx="6"/>
<rect class="tag" x="304" y="386" width="36" height="12" rx="2" stroke="var(--ink)" opacity=".45"/>
<text class="eb" x="322" y="395" text-anchor="middle">JUDGE</text>
<text class="nm" x="374" y="428" text-anchor="middle">A verdict</text>
<text class="sub" x="374" y="446" text-anchor="middle">triage · feedback</text>

<!-- 8 metrics -->
<rect class="mask" x="40" y="376" width="164" height="88" rx="6"/>
<rect class="box" x="40" y="376" width="164" height="88" rx="6"/>
<rect class="tag" x="52" y="386" width="36" height="12" rx="2" stroke="var(--ink)" opacity=".45"/>
<text class="eb" x="70" y="395" text-anchor="middle">LEARN</text>
<text class="nm" x="122" y="428" text-anchor="middle">agency metrics</text>
<text class="sub" x="122" y="446" text-anchor="middle">one rate per question</text>

<!-- legend -->
<line class="hair" x1="40" y1="512" x2="960" y2="512"/>
<text class="zn" x="40" y="530">STATE</text>
<text class="lg" x="120" y="530">CANDIDATE → HELD · SENT · REJECTED · DUPLICATE</text>
<text class="lg" x="520" y="530">GATED-OUT IS NOT ONE OF THEM — IT NEVER BECAME AN OUTPUT</text>
</svg>
<p class="colophon">docs/diagrams/run-to-board.svg — regenerate with docs/diagrams/build.py</p>
</div>
</body>
</html>
