<svg id="dg-out" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="out-title out-desc">
<title id="out-title">What an output is made of</title>
<desc id="out-desc">An output carries a type whose policy the pack declares, a subject saying what it is about, evidence items each of which may carry a locator pointing at something the run really produced, and an append-only list of the actions it took in the world.</desc>
<style>
  #dg-out{--paper:#fbfaf7;--paper2:#ffffff;--ink:#1b1a17;--muted:#504d45;--soft:#6b675e;
    --rule:rgba(27,26,23,0.16);--rule-solid:#cbc7be;--accent:#1a6743;--accent-tint:rgba(26,103,67,0.10);
    --wash:rgba(27,26,23,0.03);--wash2:rgba(27,26,23,0.06);
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){#dg-out{--paper:#14140f;--paper2:#1e1e17;--ink:#f0eee7;--muted:#bab7ac;
    --soft:#9d9a90;--rule:rgba(240,238,231,0.18);--rule-solid:#403e34;--accent:#7fd0a3;
    --accent-tint:rgba(127,208,163,0.14);--wash:rgba(240,238,231,0.045);--wash2:rgba(240,238,231,0.08)}}
  #dg-out text{font-family:var(--sans);fill:var(--ink)}
  #dg-out .zn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;fill:var(--soft)}
  #dg-out .eb{font-family:var(--mono);font-size:9px;letter-spacing:.08em;fill:var(--muted)}
  #dg-out .nm{font-size:16px;font-weight:600}
  #dg-out .fd{font-family:var(--mono);font-size:12px;fill:var(--ink)}
  #dg-out .fdk{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  #dg-out .fdm{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  #dg-out .fda{font-family:var(--mono);font-size:12px;fill:var(--accent);font-weight:600}
  #dg-out .al{font-family:var(--mono);font-size:11px;letter-spacing:.06em;fill:var(--muted)}
  #dg-out .lg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;fill:var(--muted)}
  #dg-out .mask{fill:var(--paper)}
  #dg-out .box{fill:var(--paper2);stroke:var(--ink);stroke-width:1.2}
  #dg-out .store{fill:var(--wash2);stroke:var(--muted);stroke-width:1.2}
  #dg-out .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.6}
  #dg-out .tag{fill:none;stroke:var(--rule-solid);stroke-width:1}
  #dg-out .ln{fill:none;stroke:var(--muted);stroke-width:1.6}
  #dg-out .hd{stroke:var(--rule);stroke-width:1}
  #dg-out .hair{stroke:var(--rule);stroke-width:1}
  #dg-out .mk{fill:var(--muted)}
</style>
<defs>
  <marker id="out-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon class="mk" points="0 0, 10 4, 0 8"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="var(--paper)"/>

<!-- relationships, before the boxes -->
<line class="ln" x1="304" y1="240" x2="372" y2="240" marker-end="url(#out-arrow)"/>
<line class="ln" x1="648" y1="152" x2="692" y2="152" marker-end="url(#out-arrow)"/>
<line class="ln" x1="828" y1="266" x2="828" y2="326" marker-end="url(#out-arrow)"/>
<line class="ln" x1="512" y1="404" x2="512" y2="448" marker-end="url(#out-arrow)"/>

<rect class="mask" x="310" y="216" width="58" height="16"/><text class="al" x="339" y="229" text-anchor="middle">GOVERNS</text>
<rect class="mask" x="654" y="128" width="32" height="16"/><text class="al" x="670" y="141" text-anchor="middle">HAS</text>
<rect class="mask" x="838" y="288" width="78" height="16"/><text class="al" x="838" y="301">MAY CARRY</text>
<rect class="mask" x="522" y="418" width="32" height="16"/><text class="al" x="522" y="431">DID</text>

<!-- POLICY -->
<rect class="mask" x="32" y="136" width="272" height="244" rx="8"/>
<rect class="store" x="32" y="136" width="272" height="244" rx="8"/>
<rect class="tag" x="48" y="148" width="52" height="16" rx="2"/>
<text class="eb" x="74" y="159" text-anchor="middle">POLICY</text>
<text class="nm" x="48" y="182">What the pack declares</text>
<line class="hd" x1="32" y1="192" x2="304" y2="192"/>
<text class="fdm" x="48" y="214">pack.json → outputs.&lt;type&gt;</text>
<text class="fdk" x="48" y="236">cardinality</text><text class="fd" x="140" y="236">one · many</text>
<text class="fdk" x="48" y="258">limit</text><text class="fd" x="140" y="258">how many per run</text>
<text class="fdk" x="48" y="280">anchor</text><text class="fd" x="140" y="280">required · none</text>
<text class="fdk" x="48" y="302">dedup</text><text class="fd" x="140" y="302">true · false</text>
<text class="fdk" x="48" y="324">evidence</text><text class="fd" x="140" y="324">required[] · min</text>
<text class="fdk" x="48" y="346">actions</text><text class="fd" x="140" y="346">none · sink</text>
<text class="fdk" x="48" y="368">memory</text><text class="fd" x="140" y="368">never · proposes</text>

<!-- OUTPUT (focal) -->
<rect class="mask" x="376" y="88" width="272" height="316" rx="8"/>
<rect class="focal" x="376" y="88" width="272" height="316" rx="8"/>
<rect class="tag" x="392" y="100" width="52" height="16" rx="2" stroke="var(--accent)"/>
<text class="eb" x="418" y="111" text-anchor="middle" fill="var(--accent)">OUTPUT</text>
<text class="nm" x="392" y="134">What a specialist claims</text>
<line class="hd" x1="376" y1="144" x2="648" y2="144"/>
<text class="fdm" x="392" y="166">finding.v1</text>
<text class="fda" x="392" y="192">type</text>
<text class="fda" x="392" y="214">subject { kind, ref }</text>
<text class="fd" x="392" y="236">severity · title · body</text>
<text class="fd" x="392" y="258">evidence[]</text>
<text class="fda" x="392" y="280">actions[]</text>
<text class="fd" x="392" y="302">score</text>
<text class="fd" x="392" y="324">state · fingerprint</text>
<text class="fdm" x="392" y="352">anchor — superseded by an</text>
<text class="fdm" x="392" y="372">evidence item of kind `code`,</text>
<text class="fdm" x="392" y="392">still read, no longer written</text>

<!-- EVIDENCE -->
<rect class="mask" x="696" y="88" width="264" height="178" rx="8"/>
<rect class="box" x="696" y="88" width="264" height="178" rx="8"/>
<rect class="tag" x="712" y="100" width="68" height="16" rx="2"/>
<text class="eb" x="746" y="111" text-anchor="middle">EVIDENCE</text>
<text class="nm" x="712" y="134">Why it should be believed</text>
<line class="hd" x1="696" y1="144" x2="960" y2="144"/>
<text class="fdk" x="712" y="166">kind</text><text class="fd" x="776" y="166">code · document</text>
<text class="fd" x="776" y="188">web_snapshot · …</text>
<text class="fdk" x="712" y="210">detail</text><text class="fd" x="776" y="210">what it shows</text>
<text class="fdk" x="712" y="232">source</text><text class="fd" x="776" y="232">what produced it</text>
<text class="fda" x="712" y="254">locator</text><text class="fda" x="776" y="254">{ … }</text>

<!-- LOCATOR -->
<rect class="mask" x="696" y="330" width="264" height="158" rx="8"/>
<rect class="box" x="696" y="330" width="264" height="158" rx="8"/>
<rect class="tag" x="712" y="342" width="60" height="16" rx="2"/>
<text class="eb" x="742" y="353" text-anchor="middle">LOCATOR</text>
<text class="nm" x="712" y="376">The exact thing pointed at</text>
<line class="hd" x1="696" y1="386" x2="960" y2="386"/>
<text class="fd" x="712" y="408">file · line · commit · symbol</text>
<text class="fd" x="712" y="430">command</text>
<text class="fd" x="712" y="452">url · artifact · ref</text>
<text class="fdm" x="712" y="476">checked offline, against the run</text>

<!-- ACTIONS -->
<rect class="mask" x="376" y="452" width="272" height="158" rx="8"/>
<rect class="box" x="376" y="452" width="272" height="158" rx="8"/>
<rect class="tag" x="392" y="464" width="60" height="16" rx="2"/>
<text class="eb" x="422" y="475" text-anchor="middle">ACTIONS</text>
<text class="nm" x="392" y="498">What it did in the world</text>
<line class="hd" x1="376" y1="508" x2="648" y2="508"/>
<text class="fdk" x="392" y="530">kind</text><text class="fd" x="452" y="530">the pack's own verb</text>
<text class="fdk" x="392" y="552">result</text><text class="fd" x="452" y="552">success · error</text>
<text class="fd" x="392" y="574">target · remoteId · url · at</text>
<text class="fdm" x="392" y="598">append-only, failures included</text>

<!-- legend -->
<line class="hair" x1="32" y1="650" x2="960" y2="650"/>
<text class="zn" x="32" y="678">LEGEND</text>
<text class="fda" x="120" y="678">type · subject · actions[]</text>
<text class="lg" x="328" y="678">THE THREE FIELDS THE OUTPUTS SHIFT ADDED</text>
<text class="lg" x="688" y="678">THE REST WAS ALREADY THERE</text>
</svg>
