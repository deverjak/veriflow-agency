<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The gate, and the reason it refuses · VeriFlow Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#fbfaf7;--ink:#1b1a17;--muted:#6d6a62;
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --serif:'Instrument Serif',Georgia,serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){:root{--paper:#14140f;--ink:#eceae3;--muted:#97948a}}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1200px;width:100%}
  .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
    letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
  svg{width:100%;min-width:900px;display:block}
  .colophon{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-top:1.5rem;padding-top:.75rem;border-top:1px solid rgba(109,106,98,.25)}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Flowchart · VeriFlow Agency</p>
<h1>The gate, and the reason it refuses</h1>
<svg id="dg-gate" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="gate-title gate-desc">
<title id="gate-title">The gate, and the reason it refuses</title>
<desc id="gate-desc">Six checks run in a fixed order over what a specialist wrote — the contract, the declared type, a real file and line, evidence of the right kind, whether the cited work really happened, and last the ceiling for that type — and each refusal is written aside under one of nine named reasons.</desc>
<style>
  #dg-gate{--paper:#fbfaf7;--paper2:#ffffff;--ink:#1b1a17;--muted:#504d45;--soft:#6b675e;
    --rule:rgba(27,26,23,0.16);--rule-solid:#cbc7be;--accent:#1a6743;--accent-tint:rgba(26,103,67,0.10);
    --wash:rgba(27,26,23,0.03);--wash2:rgba(27,26,23,0.06);
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){#dg-gate{--paper:#14140f;--paper2:#1e1e17;--ink:#f0eee7;--muted:#bab7ac;
    --soft:#9d9a90;--rule:rgba(240,238,231,0.18);--rule-solid:#403e34;--accent:#7fd0a3;
    --accent-tint:rgba(127,208,163,0.14);--wash:rgba(240,238,231,0.045);--wash2:rgba(240,238,231,0.08)}}
  #dg-gate text{font-family:var(--sans);fill:var(--ink)}
  #dg-gate .zn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;fill:var(--soft)}
  #dg-gate .nm{font-size:16px;font-weight:600}
  #dg-gate .sub{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  #dg-gate .rsn{font-family:var(--mono);font-size:12px;fill:var(--ink)}
  #dg-gate .rsx{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  #dg-gate .lg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;fill:var(--muted)}
  #dg-gate .mask{fill:var(--paper)}
  #dg-gate .box{fill:var(--paper2);stroke:var(--ink);stroke-width:1.2}
  #dg-gate .oval{fill:var(--wash2);stroke:var(--muted);stroke-width:1.2}
  #dg-gate .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.6}
  #dg-gate .ln{fill:none;stroke:var(--muted);stroke-width:1.6}
  #dg-gate .lead{stroke:var(--rule-solid);stroke-width:1;stroke-dasharray:3 4}
  #dg-gate .hair{stroke:var(--rule);stroke-width:1}
  #dg-gate .mk{fill:var(--muted)}
</style>
<defs>
  <marker id="gate-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon class="mk" points="0 0, 10 4, 0 8"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="var(--paper)"/>

<text class="zn" x="88" y="64">THE CHECKS, IN THE ORDER THEY RUN</text>
<text class="zn" x="560" y="64">THE NAME THE REFUSAL CARRIES</text>

<!-- spine -->
<line class="ln" x1="264" y1="152" x2="264" y2="182" marker-end="url(#gate-arrow)"/>
<line class="ln" x1="264" y1="252" x2="264" y2="282" marker-end="url(#gate-arrow)"/>
<line class="ln" x1="264" y1="352" x2="264" y2="382" marker-end="url(#gate-arrow)"/>
<line class="ln" x1="264" y1="452" x2="264" y2="482" marker-end="url(#gate-arrow)"/>
<line class="ln" x1="264" y1="552" x2="264" y2="582" marker-end="url(#gate-arrow)"/>
<line class="ln" x1="264" y1="652" x2="264" y2="682" marker-end="url(#gate-arrow)"/>
<line class="ln" x1="264" y1="752" x2="264" y2="782" marker-end="url(#gate-arrow)"/>

<!-- leaders to the reason column -->
<line class="lead" x1="448" y1="218" x2="548" y2="218"/>
<line class="lead" x1="448" y1="318" x2="548" y2="318"/>
<line class="lead" x1="448" y1="418" x2="548" y2="418"/>
<line class="lead" x1="448" y1="518" x2="548" y2="518"/>
<line class="lead" x1="448" y1="618" x2="548" y2="618"/>
<line class="lead" x1="448" y1="718" x2="548" y2="718"/>

<!-- start -->
<rect class="mask" x="88" y="96" width="352" height="56" rx="28"/>
<rect class="oval" x="88" y="96" width="352" height="56" rx="28"/>
<text class="nm" x="264" y="122" text-anchor="middle">What the specialist wrote</text>
<text class="sub" x="264" y="142" text-anchor="middle">findings.raw.json</text>

<!-- 1 -->
<rect class="mask" x="88" y="184" width="352" height="68" rx="8"/>
<rect class="box" x="88" y="184" width="352" height="68" rx="8"/>
<text class="nm" x="264" y="214" text-anchor="middle">The contract</text>
<text class="sub" x="264" y="236" text-anchor="middle">finding.v1, field by field</text>
<text class="rsn" x="560" y="223">schema</text>

<!-- 2 -->
<rect class="mask" x="88" y="284" width="352" height="68" rx="8"/>
<rect class="box" x="88" y="284" width="352" height="68" rx="8"/>
<text class="nm" x="264" y="314" text-anchor="middle">A type this pack declares</text>
<text class="sub" x="264" y="336" text-anchor="middle">pack.json → outputs</text>
<text class="rsn" x="560" y="323">unknown-type</text>

<!-- 3 -->
<rect class="mask" x="88" y="384" width="352" height="68" rx="8"/>
<rect class="box" x="88" y="384" width="352" height="68" rx="8"/>
<text class="nm" x="264" y="414" text-anchor="middle">A real file, a real line</text>
<text class="sub" x="264" y="436" text-anchor="middle">only where the type needs one</text>
<text class="rsn" x="560" y="404">missing-anchor</text>
<text class="rsn" x="560" y="424">phantom-file</text>
<text class="rsn" x="560" y="444">phantom-line</text>

<!-- 4 -->
<rect class="mask" x="88" y="484" width="352" height="68" rx="8"/>
<rect class="box" x="88" y="484" width="352" height="68" rx="8"/>
<text class="nm" x="264" y="514" text-anchor="middle">Evidence of the right kind</text>
<text class="sub" x="264" y="536" text-anchor="middle">the type outranks the dimension</text>
<text class="rsn" x="560" y="523">weak-evidence</text>

<!-- 5 -->
<rect class="mask" x="88" y="584" width="352" height="68" rx="8"/>
<rect class="box" x="88" y="584" width="352" height="68" rx="8"/>
<text class="nm" x="264" y="614" text-anchor="middle">It really happened, here</text>
<text class="sub" x="264" y="636" text-anchor="middle">checked against this run alone</text>
<text class="rsn" x="560" y="612">unproven-source</text>
<text class="rsn" x="560" y="632">unverified-evidence</text>

<!-- 6 focal -->
<rect class="mask" x="88" y="684" width="352" height="68" rx="8"/>
<rect class="focal" x="88" y="684" width="352" height="68" rx="8"/>
<text class="nm" x="264" y="714" text-anchor="middle">The ceiling for this type</text>
<text class="sub" x="264" y="736" text-anchor="middle">last, and over the survivors</text>
<text class="rsn" x="560" y="723" fill="var(--accent)">over-cardinality</text>

<!-- end -->
<rect class="mask" x="88" y="784" width="352" height="56" rx="28"/>
<rect class="oval" x="88" y="784" width="352" height="56" rx="28"/>
<text class="nm" x="264" y="810" text-anchor="middle">An output</text>
<text class="sub" x="264" y="830" text-anchor="middle">→ dedup → dispatch → memory</text>

<!-- the one thing score does -->
<text class="rsx" x="560" y="796">score never refuses an output.</text>
<text class="rsx" x="560" y="818">Where more came than the ceiling</text>
<text class="rsx" x="560" y="840">allows, it decides which — never whether.</text>

<!-- legend -->
<line class="hair" x1="88" y1="876" x2="940" y2="876"/>
<text class="zn" x="88" y="902">LEGEND</text>
<text class="lg" x="180" y="902">EVERY CHECK ASKS WHETHER THIS CAN BE TRUE. NONE ASKS HOW GOOD IT IS.</text>
</svg>
<p class="colophon">docs/diagrams/the-gate.svg — regenerate with docs/diagrams/build.py</p>
</div>
</body>
</html>
