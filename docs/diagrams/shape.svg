<svg id="dg-shape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="shape-title shape-desc">
<title id="shape-title">Where the three parts of Agency live</title>
<desc id="shape-desc">The VS Code extension and the paired phone read the runner only through its JSON contract; the runner reads the pack, which is a committed skill inside the target project alongside the project's committed memory and its gitignored run records.</desc>
<style>
  #dg-shape{--paper:#fbfaf7;--paper2:#ffffff;--ink:#1b1a17;--muted:#504d45;--soft:#6b675e;
    --rule:rgba(27,26,23,0.16);--rule-solid:#cbc7be;--accent:#1a6743;--accent-tint:rgba(26,103,67,0.10);
    --wash:rgba(27,26,23,0.03);--wash2:rgba(27,26,23,0.06);
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){#dg-shape{--paper:#14140f;--paper2:#1e1e17;--ink:#f0eee7;--muted:#bab7ac;
    --soft:#9d9a90;--rule:rgba(240,238,231,0.18);--rule-solid:#403e34;--accent:#7fd0a3;
    --accent-tint:rgba(127,208,163,0.14);--wash:rgba(240,238,231,0.045);--wash2:rgba(240,238,231,0.08)}}
  #dg-shape text{font-family:var(--sans);fill:var(--ink)}
  #dg-shape .zn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;fill:var(--soft)}
  #dg-shape .eb{font-family:var(--mono);font-size:9px;letter-spacing:.08em;fill:var(--muted)}
  #dg-shape .nm{font-size:16px;font-weight:600}
  #dg-shape .sub{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  #dg-shape .al{font-family:var(--mono);font-size:11px;letter-spacing:.06em;fill:var(--muted)}
  #dg-shape .lg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;fill:var(--muted)}
  #dg-shape .mask{fill:var(--paper)}
  #dg-shape .box{fill:var(--paper2);stroke:var(--ink);stroke-width:1.2}
  #dg-shape .store{fill:var(--wash2);stroke:var(--muted);stroke-width:1.2}
  #dg-shape .opt{fill:var(--wash);stroke:var(--rule-solid);stroke-width:1.2;stroke-dasharray:5 4}
  #dg-shape .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.6}
  #dg-shape .zone{fill:var(--wash);stroke:var(--rule);stroke-width:1}
  #dg-shape .tag{fill:none;stroke:var(--rule-solid);stroke-width:1}
  #dg-shape .ln{fill:none;stroke:var(--muted);stroke-width:1.6}
  #dg-shape .bnd{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:6 5}
  #dg-shape .hair{stroke:var(--rule);stroke-width:1}
  #dg-shape .mk{fill:var(--muted)}
</style>
<defs>
  <marker id="shape-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon class="mk" points="0 0, 10 4, 0 8"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="var(--paper)"/>

<!-- zone: the target project -->
<rect class="zone" x="40" y="464" width="920" height="216" rx="10"/>
<rect class="mask" x="60" y="468" width="300" height="16"/>
<text class="zn" x="68" y="481">TARGET PROJECT — VERSIONED WITH THE CODE</text>

<!-- the one boundary -->
<line class="bnd" x1="40" y1="256" x2="960" y2="256"/>
<rect class="mask" x="352" y="245" width="296" height="20"/>
<text class="zn" x="500" y="261" text-anchor="middle">AGENCY … --JSON · RUN.V1 · FINDING.V1</text>

<!-- connectors, drawn before the boxes -->
<path class="ln" d="M 256,192 V 280 Q 256,288 264,288 H 428 Q 436,288 436,296 V 314" marker-end="url(#shape-arrow)"/>
<path class="ln" d="M 744,192 V 280 Q 744,288 736,288 H 572 Q 564,288 564,296 V 314" marker-end="url(#shape-arrow)"/>
<path class="ln" d="M 500,424 V 522" marker-end="url(#shape-arrow)"/>
<rect class="mask" x="512" y="436" width="78" height="16"/>
<text class="al" x="518" y="449">PACK.JSON</text>

<!-- VIEWER -->
<rect class="mask" x="88" y="88" width="336" height="104" rx="8"/>
<rect class="box" x="88" y="88" width="336" height="104" rx="8"/>
<rect class="tag" x="104" y="102" width="52" height="16" rx="2"/>
<text class="eb" x="130" y="113" text-anchor="middle">VIEWER</text>
<text class="nm" x="256" y="152" text-anchor="middle">VS Code extension</text>
<text class="sub" x="256" y="174" text-anchor="middle">read-only</text>

<!-- REMOTE -->
<rect class="mask" x="576" y="88" width="336" height="104" rx="8"/>
<rect class="box" x="576" y="88" width="336" height="104" rx="8"/>
<rect class="tag" x="592" y="102" width="52" height="16" rx="2"/>
<text class="eb" x="618" y="113" text-anchor="middle">REMOTE</text>
<text class="nm" x="744" y="152" text-anchor="middle">A paired phone</text>
<text class="sub" x="744" y="174" text-anchor="middle">agency serve · tailnet</text>

<!-- RUNNER -->
<rect class="mask" x="320" y="320" width="360" height="104" rx="8"/>
<rect class="box" x="320" y="320" width="360" height="104" rx="8"/>
<rect class="tag" x="336" y="334" width="52" height="16" rx="2"/>
<text class="eb" x="362" y="345" text-anchor="middle">RUNNER</text>
<text class="nm" x="500" y="384" text-anchor="middle">agency</text>
<text class="sub" x="500" y="406" text-anchor="middle">run · gate · dedup · memory</text>

<!-- MEMORY -->
<rect class="mask" x="72" y="528" width="256" height="112" rx="8"/>
<rect class="store" x="72" y="528" width="256" height="112" rx="8"/>
<rect class="tag" x="88" y="542" width="72" height="16" rx="2"/>
<text class="eb" x="124" y="553" text-anchor="middle">COMMITTED</text>
<text class="nm" x="200" y="594" text-anchor="middle">Memory</text>
<text class="sub" x="200" y="616" text-anchor="middle">.agency/knowledge/</text>

<!-- THE PACK (focal) -->
<rect class="mask" x="372" y="528" width="256" height="112" rx="8"/>
<rect class="focal" x="372" y="528" width="256" height="112" rx="8"/>
<rect class="tag" x="388" y="542" width="48" height="16" rx="2" stroke="var(--accent)"/>
<text class="eb" x="412" y="553" text-anchor="middle" fill="var(--accent)">SKILL</text>
<text class="nm" x="500" y="594" text-anchor="middle">The specialist</text>
<text class="sub" x="500" y="616" text-anchor="middle">.claude/skills/agency-&lt;name&gt;/</text>

<!-- RUN RECORDS -->
<rect class="mask" x="672" y="528" width="256" height="112" rx="8"/>
<rect class="opt" x="672" y="528" width="256" height="112" rx="8"/>
<rect class="tag" x="688" y="542" width="80" height="16" rx="2"/>
<text class="eb" x="728" y="553" text-anchor="middle">GITIGNORED</text>
<text class="nm" x="800" y="594" text-anchor="middle">Run records</text>
<text class="sub" x="800" y="616" text-anchor="middle">.agency/runs/&lt;ULID&gt;/</text>

<!-- legend -->
<line class="hair" x1="40" y1="712" x2="960" y2="712"/>
<text class="zn" x="40" y="737">LEGEND</text>
<rect class="focal" x="116" y="726" width="20" height="14" rx="3"/>
<text class="lg" x="146" y="737">A SKILL, NOT A CONFIG</text>
<rect class="store" x="352" y="726" width="20" height="14" rx="3"/>
<text class="lg" x="382" y="737">IN GIT</text>
<rect class="opt" x="468" y="726" width="20" height="14" rx="3"/>
<text class="lg" x="498" y="737">NOT IN GIT</text>
<line class="bnd" x1="616" y1="733" x2="644" y2="733"/>
<text class="lg" x="654" y="737">THE ONLY BOUNDARY</text>
</svg>
