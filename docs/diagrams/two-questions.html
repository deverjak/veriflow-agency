<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two questions about one bet, counted apart · VeriFlow Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#fbfaf7;--ink:#1b1a17;--muted:#6d6a62;
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --serif:'Instrument Serif',Georgia,serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){:root{--paper:#14140f;--ink:#eceae3;--muted:#97948a}}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1200px;width:100%}
  .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
    letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
  svg{width:100%;min-width:900px;display:block}
  .colophon{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-top:1.5rem;padding-top:.75rem;border-top:1px solid rgba(109,106,98,.25)}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">State machine · VeriFlow Agency</p>
<h1>Two questions about one bet, counted apart</h1>
<svg id="dg-2q" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="q2-title q2-desc">
<title id="q2-title">Two questions about one bet, counted apart</title>
<desc id="q2-desc">A type may declare more than one lifecycle: whether the bet was chosen is one question with its own rate, and whether it worked is a second question asked only of the bets that were chosen, so the two numbers never collapse into one.</desc>
<style>
  #dg-2q{--paper:#fbfaf7;--paper2:#ffffff;--ink:#1b1a17;--muted:#504d45;--soft:#6b675e;
    --rule:rgba(27,26,23,0.16);--rule-solid:#cbc7be;--accent:#1a6743;--accent-tint:rgba(26,103,67,0.10);
    --wash:rgba(27,26,23,0.03);--wash2:rgba(27,26,23,0.06);
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --serif:'Instrument Serif',Georgia,'Times New Roman',serif}
  @media (prefers-color-scheme:dark){#dg-2q{--paper:#14140f;--paper2:#1e1e17;--ink:#f0eee7;--muted:#bab7ac;
    --soft:#9d9a90;--rule:rgba(240,238,231,0.18);--rule-solid:#403e34;--accent:#7fd0a3;
    --accent-tint:rgba(127,208,163,0.14);--wash:rgba(240,238,231,0.045);--wash2:rgba(240,238,231,0.08)}}
  #dg-2q text{font-family:var(--sans);fill:var(--ink)}
  #dg-2q .zn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;fill:var(--soft)}
  #dg-2q .eb{font-family:var(--mono);font-size:9px;letter-spacing:.08em;fill:var(--muted)}
  #dg-2q .nm{font-size:16px;font-weight:600}
  #dg-2q .key{font-family:var(--mono);font-size:15px;font-weight:600}
  #dg-2q .sub{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  #dg-2q .al{font-family:var(--mono);font-size:11px;letter-spacing:.06em;fill:var(--muted)}
  #dg-2q .pol{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  #dg-2q .rd{font-family:var(--mono);font-size:13px;fill:var(--ink)}
  #dg-2q .rdm{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  #dg-2q .aside{font-family:var(--serif);font-style:italic;font-size:19px;fill:var(--muted)}
  #dg-2q .mask{fill:var(--paper)}
  #dg-2q .box{fill:var(--paper2);stroke:var(--ink);stroke-width:1.2}
  #dg-2q .store{fill:var(--wash2);stroke:var(--muted);stroke-width:1.2}
  #dg-2q .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.6}
  #dg-2q .zone{fill:var(--wash);stroke:var(--rule);stroke-width:1}
  #dg-2q .tag{fill:none;stroke:var(--rule-solid);stroke-width:1}
  #dg-2q .ln{fill:none;stroke:var(--muted);stroke-width:1.6}
  #dg-2q .ln-a{fill:none;stroke:var(--accent);stroke-width:1.6}
  #dg-2q .hd{stroke:var(--rule);stroke-width:1}
  #dg-2q .lead{stroke:var(--rule-solid);stroke-width:1;stroke-dasharray:3 4}
  #dg-2q .hair{stroke:var(--rule);stroke-width:1}
  #dg-2q .dot{fill:var(--muted)}
  #dg-2q .mk{fill:var(--muted)}
  #dg-2q .mk-a{fill:var(--accent)}
</style>
<defs>
  <marker id="q2-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon class="mk" points="0 0, 10 4, 0 8"/>
  </marker>
  <marker id="q2-arrow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon class="mk-a" points="0 0, 10 4, 0 8"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="var(--paper)"/>

<!-- zones -->
<rect class="zone" x="376" y="104" width="264" height="352" rx="10"/>
<rect class="mask" x="392" y="108" width="196" height="16"/>
<text class="zn" x="400" y="121">SELECTION · SELECTION_RATE</text>

<rect class="zone" x="696" y="96" width="264" height="244" rx="10"/>
<rect class="mask" x="712" y="100" width="168" height="16"/>
<text class="zn" x="720" y="113">OUTCOME · SUCCESS_RATE</text>

<!-- connectors -->
<line class="ln" x1="288" y1="288" x2="330" y2="288"/>
<circle class="dot" cx="336" cy="288" r="5"/>
<path class="ln" d="M 336,288 V 204 Q 336,196 344,196 H 394" marker-end="url(#q2-arrow)"/>
<path class="ln" d="M 336,288 V 372 Q 336,380 344,380 H 394" marker-end="url(#q2-arrow)"/>
<line class="ln-a" x1="616" y1="196" x2="716" y2="196" marker-end="url(#q2-arrow-a)"/>

<rect class="mask" x="296" y="264" width="54" height="16"/><text class="al" x="298" y="277">ANSWER</text>
<rect class="mask" x="628" y="172" width="72" height="16"/><text class="al" x="664" y="185" text-anchor="middle" fill="var(--accent)">REQUIRES</text>

<!-- the output -->
<rect class="mask" x="40" y="232" width="248" height="112" rx="8"/>
<rect class="store" x="40" y="232" width="248" height="112" rx="8"/>
<rect class="tag" x="56" y="246" width="52" height="16" rx="2"/>
<text class="eb" x="82" y="257" text-anchor="middle">OUTPUT</text>
<text class="nm" x="164" y="298" text-anchor="middle">A bet</text>
<text class="sub" x="164" y="320" text-anchor="middle">type = bet</text>

<!-- selected (focal) -->
<rect class="mask" x="400" y="152" width="216" height="88" rx="8"/>
<rect class="focal" x="400" y="152" width="216" height="88" rx="8"/>
<text class="key" x="418" y="192" fill="var(--accent)">selected</text>
<text class="sub" x="418" y="214">the founder took it</text>
<rect class="tag" x="576" y="166" width="22" height="16" rx="2" stroke="var(--accent)"/>
<text class="pol" x="587" y="178" text-anchor="middle" fill="var(--accent)">+</text>

<!-- rejected -->
<rect class="mask" x="400" y="336" width="216" height="88" rx="8"/>
<rect class="box" x="400" y="336" width="216" height="88" rx="8"/>
<text class="key" x="418" y="376">rejected</text>
<text class="sub" x="418" y="398">it was not taken</text>
<rect class="tag" x="576" y="350" width="22" height="16" rx="2"/>
<text class="pol" x="587" y="362" text-anchor="middle">−</text>

<line class="lead" x1="616" y1="380" x2="652" y2="380"/>
<text class="sub" x="660" y="376">a rejected bet is never asked</text>
<text class="sub" x="660" y="396">how it turned out — it has no outcome</text>

<!-- outcome -->
<rect class="mask" x="720" y="136" width="232" height="172" rx="8"/>
<rect class="box" x="720" y="136" width="232" height="172" rx="8"/>
<text class="nm" x="736" y="168">Did it work?</text>
<text class="sub" x="736" y="190">requires: selection.selected</text>
<line class="hd" x1="720" y1="202" x2="952" y2="202"/>
<text class="key" x="736" y="230">successful</text>
<rect class="tag" x="908" y="216" width="22" height="16" rx="2"/>
<text class="pol" x="919" y="228" text-anchor="middle">+</text>
<text class="key" x="736" y="262">failed</text>
<rect class="tag" x="908" y="248" width="22" height="16" rx="2"/>
<text class="pol" x="919" y="260" text-anchor="middle">−</text>
<text class="key" x="736" y="294">abandoned</text>
<rect class="tag" x="908" y="280" width="22" height="16" rx="2"/>
<text class="pol" x="919" y="292" text-anchor="middle">·</text>

<!-- readout -->
<line class="hair" x1="40" y1="488" x2="960" y2="488"/>
<text class="zn" x="40" y="514">HOW EACH RATE IS COUNTED</text>
<text class="rd" x="40" y="542">selection_rate = selected / (selected + rejected)</text>
<text class="rd" x="40" y="564">success_rate   = successful / (successful + failed)</text>
<text class="rdm" x="40" y="588">a neutral answer is recorded and left out of the ratio; a question nobody answered is undecided, not a failure</text>

<text class="aside" x="40" y="634">(selected + successful) / everything is neither of these. It is a number that looks like a metric.</text>
</svg>
<p class="colophon">docs/diagrams/two-questions.svg — regenerate with docs/diagrams/build.py</p>
</div>
</body>
</html>
