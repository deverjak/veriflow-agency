<svg id="dg-run" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="run-title run-desc">
<title id="run-title">From a run to a board and back</title>
<desc id="run-desc">Eight stages carry a specialist's work from preparing the run to the metrics: prepare, the agent, the gate, dedup, dispatch, the board and committed memory, a person's verdict, and the metrics that verdict feeds; what the gate refuses is written aside with its reason instead.</desc>
<style>
  #dg-run{--paper:#fbfaf7;--paper2:#ffffff;--ink:#1b1a17;--muted:#504d45;--soft:#6b675e;
    --rule:rgba(27,26,23,0.16);--rule-solid:#cbc7be;--accent:#1a6743;--accent-tint:rgba(26,103,67,0.10);
    --wash:rgba(27,26,23,0.03);--wash2:rgba(27,26,23,0.06);
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){#dg-run{--paper:#14140f;--paper2:#1e1e17;--ink:#f0eee7;--muted:#bab7ac;
    --soft:#9d9a90;--rule:rgba(240,238,231,0.18);--rule-solid:#403e34;--accent:#7fd0a3;
    --accent-tint:rgba(127,208,163,0.14);--wash:rgba(240,238,231,0.045);--wash2:rgba(240,238,231,0.08)}}
  #dg-run text{font-family:var(--sans);fill:var(--ink)}
  #dg-run .zn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;fill:var(--soft)}
  #dg-run .eb{font-family:var(--mono);font-size:9px;letter-spacing:.08em;fill:var(--muted)}
  #dg-run .nm{font-size:16px;font-weight:600}
  #dg-run .sub{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  #dg-run .al{font-family:var(--mono);font-size:11px;letter-spacing:.06em;fill:var(--muted)}
  #dg-run .lg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;fill:var(--muted)}
  #dg-run .mask{fill:var(--paper)}
  #dg-run .box{fill:var(--paper2);stroke:var(--ink);stroke-width:1.2}
  #dg-run .store{fill:var(--wash2);stroke:var(--muted);stroke-width:1.2}
  #dg-run .opt{fill:var(--wash);stroke:var(--rule-solid);stroke-width:1.2;stroke-dasharray:5 4}
  #dg-run .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.6}
  #dg-run .tag{fill:none;stroke:var(--rule-solid);stroke-width:1}
  #dg-run .ln{fill:none;stroke:var(--muted);stroke-width:1.6}
  #dg-run .ln-a{fill:none;stroke:var(--accent);stroke-width:1.6}
  #dg-run .ln-d{fill:none;stroke:var(--rule-solid);stroke-width:1.4;stroke-dasharray:5 4}
  #dg-run .hair{stroke:var(--rule);stroke-width:1}
  #dg-run .mk{fill:var(--muted)}
  #dg-run .mk-a{fill:var(--accent)}
  #dg-run .mk-d{fill:var(--rule-solid)}
</style>
<defs>
  <marker id="run-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon class="mk" points="0 0, 10 4, 0 8"/>
  </marker>
  <marker id="run-arrow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon class="mk-a" points="0 0, 10 4, 0 8"/>
  </marker>
  <marker id="run-arrow-d" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon class="mk-d" points="0 0, 10 4, 0 8"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="var(--paper)"/>

<text class="zn" x="40" y="104">THE RUN, AND THE GATE AT THE END OF IT</text>
<text class="zn" x="40" y="376">WHAT CAME OF IT — READ RIGHT TO LEFT</text>

<!-- connectors first -->
<line class="ln" x1="204" y1="208" x2="288" y2="208" marker-end="url(#run-arrow)"/>
<line class="ln" x1="456" y1="208" x2="540" y2="208" marker-end="url(#run-arrow)"/>
<line class="ln-a" x1="708" y1="208" x2="792" y2="208" marker-end="url(#run-arrow-a)"/>
<path class="ln" d="M 878,264 V 394" marker-end="url(#run-arrow)"/>
<line class="ln" x1="796" y1="456" x2="712" y2="456" marker-end="url(#run-arrow)"/>
<line class="ln" x1="544" y1="456" x2="460" y2="456" marker-end="url(#run-arrow)"/>
<line class="ln" x1="292" y1="456" x2="208" y2="456" marker-end="url(#run-arrow)"/>
<path class="ln-d" d="M 626,264 V 298" marker-end="url(#run-arrow-d)"/>

<!-- arrow labels: the mask keeps 8px clear of the stroke -->
<rect class="mask" x="222" y="184" width="50" height="16"/><text class="al" x="247" y="197" text-anchor="middle">PROMPT</text>
<rect class="mask" x="466" y="184" width="66" height="16"/><text class="al" x="499" y="197" text-anchor="middle">FINDINGS</text>
<rect class="mask" x="716" y="184" width="72" height="16"/><text class="al" x="752" y="197" text-anchor="middle">SURVIVORS</text>
<rect class="mask" x="890" y="316" width="76" height="16"/><text class="al" x="890" y="329">IF NOT HELD</text>
<rect class="mask" x="726" y="432" width="56" height="16"/><text class="al" x="754" y="445" text-anchor="middle">ACTION</text>
<rect class="mask" x="472" y="432" width="56" height="16"/><text class="al" x="500" y="445" text-anchor="middle">A PERSON</text>
<rect class="mask" x="228" y="432" width="48" height="16"/><text class="al" x="252" y="445" text-anchor="middle">EVENTS</text>
<rect class="mask" x="638" y="270" width="60" height="16"/><text class="al" x="640" y="283">REFUSED</text>

<!-- 1 prepare -->
<rect class="mask" x="40" y="152" width="164" height="112" rx="8"/>
<rect class="box" x="40" y="152" width="164" height="112" rx="8"/>
<rect class="tag" x="54" y="166" width="60" height="16" rx="2"/>
<text class="eb" x="84" y="177" text-anchor="middle">PREPARE</text>
<text class="nm" x="122" y="216" text-anchor="middle">agency run</text>
<text class="sub" x="122" y="238" text-anchor="middle">context.json</text>

<!-- 2 the agent -->
<rect class="mask" x="292" y="152" width="164" height="112" rx="8"/>
<rect class="box" x="292" y="152" width="164" height="112" rx="8"/>
<rect class="tag" x="306" y="166" width="40" height="16" rx="2"/>
<text class="eb" x="326" y="177" text-anchor="middle">WORK</text>
<text class="nm" x="374" y="216" text-anchor="middle">The agent</text>
<text class="sub" x="374" y="238" text-anchor="middle">claude · codex</text>

<!-- 3 the gate (focal) -->
<rect class="mask" x="544" y="152" width="164" height="112" rx="8"/>
<rect class="focal" x="544" y="152" width="164" height="112" rx="8"/>
<rect class="tag" x="558" y="166" width="68" height="16" rx="2" stroke="var(--accent)"/>
<text class="eb" x="592" y="177" text-anchor="middle" fill="var(--accent)">THE GATE</text>
<text class="nm" x="626" y="216" text-anchor="middle">agency ingest</text>
<text class="sub" x="626" y="238" text-anchor="middle">nine refusals</text>

<!-- 4 dedup -->
<rect class="mask" x="796" y="152" width="164" height="112" rx="8"/>
<rect class="box" x="796" y="152" width="164" height="112" rx="8"/>
<rect class="tag" x="810" y="166" width="48" height="16" rx="2"/>
<text class="eb" x="834" y="177" text-anchor="middle">PLACE</text>
<text class="nm" x="878" y="216" text-anchor="middle">Dedup</text>
<text class="sub" x="878" y="238" text-anchor="middle">subject key</text>

<!-- refused -->
<rect class="mask" x="544" y="298" width="164" height="64" rx="8"/>
<rect class="opt" x="544" y="298" width="164" height="64" rx="8"/>
<text class="nm" x="626" y="324" text-anchor="middle">gated.json</text>
<text class="sub" x="626" y="346" text-anchor="middle">with the reason</text>

<!-- 5 dispatch -->
<rect class="mask" x="796" y="400" width="164" height="112" rx="8"/>
<rect class="box" x="796" y="400" width="164" height="112" rx="8"/>
<rect class="tag" x="810" y="414" width="36" height="16" rx="2"/>
<text class="eb" x="828" y="425" text-anchor="middle">ACT</text>
<text class="nm" x="878" y="464" text-anchor="middle">Dispatch</text>
<text class="sub" x="878" y="486" text-anchor="middle">the pack's sink</text>

<!-- 6 lands -->
<rect class="mask" x="544" y="400" width="164" height="112" rx="8"/>
<rect class="store" x="544" y="400" width="164" height="112" rx="8"/>
<rect class="tag" x="558" y="414" width="48" height="16" rx="2"/>
<text class="eb" x="582" y="425" text-anchor="middle">LANDS</text>
<text class="nm" x="626" y="464" text-anchor="middle">Board · memory</text>
<text class="sub" x="626" y="486" text-anchor="middle">actions[]</text>

<!-- 7 verdict -->
<rect class="mask" x="292" y="400" width="164" height="112" rx="8"/>
<rect class="box" x="292" y="400" width="164" height="112" rx="8"/>
<rect class="tag" x="306" y="414" width="48" height="16" rx="2"/>
<text class="eb" x="330" y="425" text-anchor="middle">JUDGE</text>
<text class="nm" x="374" y="464" text-anchor="middle">A verdict</text>
<text class="sub" x="374" y="486" text-anchor="middle">triage · feedback</text>

<!-- 8 metrics -->
<rect class="mask" x="40" y="400" width="164" height="112" rx="8"/>
<rect class="box" x="40" y="400" width="164" height="112" rx="8"/>
<rect class="tag" x="54" y="414" width="48" height="16" rx="2"/>
<text class="eb" x="78" y="425" text-anchor="middle">LEARN</text>
<text class="nm" x="122" y="464" text-anchor="middle">agency metrics</text>
<text class="sub" x="122" y="486" text-anchor="middle">a rate per question</text>

<!-- legend -->
<line class="hair" x1="40" y1="560" x2="960" y2="560"/>
<text class="zn" x="40" y="588">STATE</text>
<text class="lg" x="128" y="588">CANDIDATE → HELD · SENT · REJECTED · DUPLICATE</text>
<text class="lg" x="128" y="612">GATED-OUT IS NOT ONE OF THEM — IT NEVER BECAME AN OUTPUT</text>
</svg>
