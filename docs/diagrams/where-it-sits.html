<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where an output sits, and how dedup finds out · VeriFlow Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#fbfaf7;--ink:#1b1a17;--muted:#6d6a62;
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --serif:'Instrument Serif',Georgia,serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){:root{--paper:#14140f;--ink:#eceae3;--muted:#97948a}}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1200px;width:100%}
  .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
    letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
  svg{width:100%;min-width:900px;display:block}
  .colophon{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-top:1.5rem;padding-top:.75rem;border-top:1px solid rgba(109,106,98,.25)}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Flowchart · VeriFlow Agency</p>
<h1>Where an output sits, and how dedup finds out</h1>
<svg id="dg-sits" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" role="img" aria-labelledby="sits-title sits-desc">
<title id="sits-title">Where an output sits, and how dedup finds out</title>
<desc id="sits-desc">Three questions are asked in order to give an output a place: the subject the pack declared, then a symbol from the anchor, then a file; the first that answers wins, and an output that answers none has no place rather than a shared placeholder.</desc>
<style>
  #dg-sits{--paper:#fbfaf7;--paper2:#ffffff;--ink:#1b1a17;--muted:#6d6a62;--soft:#8f8c83;
    --rule:rgba(27,26,23,0.12);--rule-solid:#e6e3dc;--accent:#1f6f4a;--accent-tint:rgba(31,111,74,0.08);
    --wash:rgba(27,26,23,0.02);--wash2:rgba(27,26,23,0.05);
    --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --serif:'Instrument Serif',Georgia,'Times New Roman',serif}
  @media (prefers-color-scheme:dark){#dg-sits{--paper:#14140f;--paper2:#1b1b15;--ink:#eceae3;--muted:#97948a;
    --soft:#7d7a71;--rule:rgba(236,234,227,0.12);--rule-solid:#2b2a24;--accent:#6cba8e;
    --accent-tint:rgba(108,186,142,0.12);--wash:rgba(236,234,227,0.03);--wash2:rgba(236,234,227,0.06)}}
  #dg-sits text{font-family:var(--sans);fill:var(--ink)}
  #dg-sits .zn{font-family:var(--mono);font-size:7px;letter-spacing:.14em;fill:var(--soft)}
  #dg-sits .nm{font-size:12px;font-weight:600}
  #dg-sits .sub{font-family:var(--mono);font-size:9px;fill:var(--muted)}
  #dg-sits .key{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink)}
  #dg-sits .al{font-family:var(--mono);font-size:8px;letter-spacing:.06em;fill:var(--soft)}
  #dg-sits .aside{font-family:var(--serif);font-style:italic;font-size:14px;fill:var(--muted)}
  #dg-sits .mask{fill:var(--paper)}
  #dg-sits .box{fill:var(--paper2);stroke:var(--ink);stroke-width:1}
  #dg-sits .oval{fill:var(--wash2);stroke:var(--muted);stroke-width:1}
  #dg-sits .dia{fill:var(--paper2);stroke:var(--ink);stroke-width:1}
  #dg-sits .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1}
  #dg-sits .opt{fill:var(--wash);stroke:var(--rule-solid);stroke-width:1;stroke-dasharray:4 3}
  #dg-sits .ln{fill:none;stroke:var(--muted);stroke-width:1.2}
  #dg-sits .mk{fill:var(--muted)}
</style>
<defs>
  <marker id="sits-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon class="mk" points="0 0, 8 3, 0 6"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="var(--paper)"/>

<text class="zn" x="160" y="52">DEDUP.SUBJECT_KEY — ASKED IN THIS ORDER</text>

<!-- connectors -->
<line class="ln" x1="260" y1="120" x2="260" y2="150" marker-end="url(#sits-arrow)"/>
<line class="ln" x1="360" y1="192" x2="518" y2="192" marker-end="url(#sits-arrow)"/>
<line class="ln" x1="260" y1="232" x2="260" y2="270" marker-end="url(#sits-arrow)"/>
<line class="ln" x1="360" y1="312" x2="518" y2="312" marker-end="url(#sits-arrow)"/>
<line class="ln" x1="260" y1="352" x2="260" y2="390" marker-end="url(#sits-arrow)"/>
<line class="ln" x1="360" y1="432" x2="518" y2="432" marker-end="url(#sits-arrow)"/>
<line class="ln" x1="260" y1="472" x2="260" y2="510" marker-end="url(#sits-arrow)"/>

<rect class="mask" x="424" y="172" width="28" height="12"/><text class="al" x="438" y="181" text-anchor="middle">YES</text>
<rect class="mask" x="424" y="292" width="28" height="12"/><text class="al" x="438" y="301" text-anchor="middle">YES</text>
<rect class="mask" x="424" y="412" width="28" height="12"/><text class="al" x="438" y="421" text-anchor="middle">YES</text>
<rect class="mask" x="268" y="245" width="24" height="12"/><text class="al" x="268" y="254">NO</text>
<rect class="mask" x="268" y="365" width="24" height="12"/><text class="al" x="268" y="374">NO</text>
<rect class="mask" x="268" y="485" width="24" height="12"/><text class="al" x="268" y="494">NO</text>

<!-- start -->
<rect class="mask" x="160" y="72" width="200" height="48" rx="24"/>
<rect class="oval" x="160" y="72" width="200" height="48" rx="24"/>
<text class="nm" x="260" y="102" text-anchor="middle">An output</text>

<!-- Q1 -->
<path class="mask" d="M 260,152 L 360,192 L 260,232 L 160,192 Z"/>
<path class="dia" d="M 260,152 L 360,192 L 260,232 L 160,192 Z"/>
<text class="nm" x="260" y="190" text-anchor="middle">A subject?</text>
<text class="sub" x="260" y="206" text-anchor="middle">{ kind, ref }</text>

<!-- Q2 -->
<path class="mask" d="M 260,272 L 360,312 L 260,352 L 160,312 Z"/>
<path class="dia" d="M 260,272 L 360,312 L 260,352 L 160,312 Z"/>
<text class="nm" x="260" y="310" text-anchor="middle">A symbol?</text>
<text class="sub" x="260" y="326" text-anchor="middle">from the anchor</text>

<!-- Q3 -->
<path class="mask" d="M 260,392 L 360,432 L 260,472 L 160,432 Z"/>
<path class="dia" d="M 260,392 L 360,432 L 260,472 L 160,432 Z"/>
<text class="nm" x="260" y="430" text-anchor="middle">A file?</text>
<text class="sub" x="260" y="446" text-anchor="middle">from the anchor</text>

<!-- nowhere -->
<rect class="mask" x="160" y="512" width="200" height="48" rx="24"/>
<rect class="oval" x="160" y="512" width="200" height="48" rx="24"/>
<text class="nm" x="260" y="542" text-anchor="middle">No place at all</text>

<!-- answers -->
<rect class="mask" x="520" y="168" width="400" height="48" rx="6"/>
<rect class="focal" x="520" y="168" width="400" height="48" rx="6"/>
<text class="key" x="536" y="190" fill="var(--accent)">kind:ref</text>
<text class="sub" x="536" y="206">the pack said what this is about — a bet on a market, a board item</text>

<rect class="mask" x="520" y="288" width="400" height="48" rx="6"/>
<rect class="box" x="520" y="288" width="400" height="48" rx="6"/>
<text class="key" x="536" y="310">sym:&lt;name&gt;</text>
<text class="sub" x="536" y="326">survives a moved block and a refactor</text>

<rect class="mask" x="520" y="408" width="400" height="48" rx="6"/>
<rect class="box" x="520" y="408" width="400" height="48" rx="6"/>
<text class="key" x="536" y="430">file:&lt;path&gt;</text>
<text class="sub" x="536" y="446">weaker, but still independent of the line</text>

<rect class="mask" x="520" y="512" width="400" height="48" rx="6"/>
<rect class="opt" x="520" y="512" width="400" height="48" rx="6"/>
<text class="key" x="536" y="534" fill="var(--muted)">""</text>
<text class="sub" x="536" y="550">empty — and that is a place of its own</text>

<text class="aside" x="160" y="608">Empty is not <tspan font-family="var(--mono)" font-size="12px" font-style="normal">file:?</tspan> — one shared placeholder would put every anchorless output in the same place,</text>
<text class="aside" x="160" y="630">and turn “two claims in two places are two claims” into its exact opposite.</text>
</svg>
<p class="colophon">docs/diagrams/where-it-sits.svg — regenerate with docs/diagrams/build.py</p>
</div>
</body>
</html>
